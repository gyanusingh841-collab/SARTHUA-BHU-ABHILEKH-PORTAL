<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="48%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
  
  <!-- Tricolor Ribbon at Top -->
  <rect x="15" y="8" width="34" height="3" rx="1.5" fill="url(#flagGrad)" />

  <!-- Government Landmark Crest -->
  <g filter="url(#glow)">
    <!-- Pediment (Roof triangle) -->
    <polygon points="32,15 14,24 50,24" fill="url(#goldGrad)" />
    <!-- Architrave Beam -->
    <rect x="16" y="25" width="32" height="3" rx="1" fill="#f8fafc" />
    <!-- 4 Classical Pillars -->
    <rect x="18" y="29" width="4" height="17" rx="1" fill="url(#goldGrad)" />
    <rect x="26" y="29" width="4" height="17" rx="1" fill="url(#goldGrad)" />
    <rect x="34" y="29" width="4" height="17" rx="1" fill="url(#goldGrad)" />
    <rect x="42" y="29" width="4" height="17" rx="1" fill="url(#goldGrad)" />
    <!-- Plinth Beam -->
    <rect x="15" y="47" width="34" height="3.5" rx="1" fill="#f8fafc" />
    <!-- Base Step -->
    <rect x="12" y="51.5" width="40" height="4" rx="1.5" fill="url(#goldGrad)" />
  </g>
</svg>
