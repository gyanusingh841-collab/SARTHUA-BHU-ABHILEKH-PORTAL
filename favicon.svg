<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15407a" />
      <stop offset="1" stop-color="#0b1e36" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="0.55" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.333" stop-color="#ff9933" />
      <stop offset="0.333" stop-color="#ffffff" />
      <stop offset="0.666" stop-color="#ffffff" />
      <stop offset="0.666" stop-color="#138808" />
    </linearGradient>
  </defs>

  <!-- Squircle base -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#bg)" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- Tricolor bar -->
  <rect x="19" y="9" width="26" height="3.5" rx="1.75" fill="url(#flag)" />

  <!-- Landmark crest -->
  <polygon points="32,16 12,26.5 52,26.5" fill="url(#gold)" />
  <rect x="14" y="28" width="36" height="3.5" rx="1" fill="#f8fafc" />
  <rect x="17" y="33" width="5" height="13" rx="1" fill="url(#gold)" />
  <rect x="25" y="33" width="5" height="13" rx="1" fill="url(#gold)" />
  <rect x="34" y="33" width="5" height="13" rx="1" fill="url(#gold)" />
  <rect x="42" y="33" width="5" height="13" rx="1" fill="url(#gold)" />
  <rect x="14" y="47.5" width="36" height="3.5" rx="1" fill="#f8fafc" />
  <rect x="10" y="52.5" width="44" height="4" rx="1.5" fill="url(#gold)" />
</svg>
